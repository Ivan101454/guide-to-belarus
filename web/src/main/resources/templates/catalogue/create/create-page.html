<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Author &ndash; create new article</title>
    <link rel="stylesheet" data-th-href="@{/css/admin/admin-style.css}">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap">
</head>
<body>
<main>
    <h1>Create new article</h1>
    <form date-th-action="@{/web/articles/create}" method="post">
        title<br><input type="text" name="title"><br>
        content<br><textarea cols="50" rows="3" name="description"></textarea><br>
        category<br><select>
                        <option data-th-each="category: ${categories}" data-th-value="${category}" data-th-text="${category}"></option>
                    </select><br>
        <br>templatePath<br><input type="text" name="templatePath"><br>
        imagePath<br><input type="text" name="imagePath"><br>
        <input type="submit" value="Submit">
    </form>
</main>
<script src="admin-script.js"></script>
</body>
</html>
